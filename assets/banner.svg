<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Trend Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .anim-pulse {
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    .anim-wave-1 {
      animation: waveMove1 12s linear infinite;
    }
    .anim-wave-2 {
      animation: waveMove2 8s linear infinite;
    }
    .anim-float {
      animation: floatPill 6s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.7; transform: scale(1.02); }
    }
    @keyframes waveMove1 {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 600; }
    }
    @keyframes waveMove2 {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <circle cx="200" cy="180" r="160" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="anim-pulse" />
  <circle cx="1000" cy="150" r="180" fill="#a855f7" opacity="0.12" filter="url(#glow)" class="anim-pulse" />

  <!-- Animated Market Trend Waves (Background Layer) -->
  <g opacity="0.45">
    <!-- Trend Line 1 (Bullish Surge) -->
    <path d="M 0 280 Q 200 320, 380 230 T 750 180 T 1000 110 T 1200 70" 
          fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 6" class="anim-wave-1" />
    
    <!-- Trend Line 2 (Momentum Acceleration) -->
    <path d="M 0 310 C 250 310, 420 200, 680 220 C 900 240, 1050 140, 1200 90" 
          fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 6" class="anim-wave-2" />

    <!-- Candlestick / Bar Chart Graphic Elements in Background -->
    <rect x="780" y="220" width="8" height="50" rx="2" fill="#38bdf8" opacity="0.3" />
    <line x1="784" y1="205" x2="784" y2="280" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />
    
    <rect x="830" y="190" width="8" height="70" rx="2" fill="#34d399" opacity="0.35" />
    <line x1="834" y1="175" x2="834" y2="275" stroke="#34d399" stroke-width="1.5" opacity="0.35" />

    <rect x="880" y="160" width="8" height="85" rx="2" fill="#38bdf8" opacity="0.4" />
    <line x1="884" y1="145" x2="884" y2="260" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />

    <rect x="930" y="130" width="8" height="100" rx="2" fill="#34d399" opacity="0.45" />
    <line x1="934" y1="110" x2="934" y2="245" stroke="#34d399" stroke-width="1.5" opacity="0.45" />

    <rect x="980" y="100" width="8" height="115" rx="2" fill="#38bdf8" opacity="0.5" />
    <line x1="984" y1="80" x2="984" y2="230" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
  </g>

  <!-- Foreground Content (Solid readability) -->
  <g transform="translate(80, 0)">
    <!-- Header Badge -->
    <g transform="translate(0, 58)" class="anim-float">
      <rect width="260" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8" />
      <text x="30" y="21" class="badge-label" fill="#7dd3fc">MARKET INTEL &amp; TREND RADAR</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title-text">Awesome Market Data &amp;</text>
    <text x="0" y="200" class="title-text" fill="url(#primaryGrad)">Trend Analysis</text>

    <!-- Subtitle -->
    <text x="0" y="245" class="subtitle-text">Curated SaaS platforms, quantitative engines &amp; open-source trend discovery tools</text>

    <!-- Tech Feature Pills -->
    <g transform="translate(0, 275)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="168" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="14" y="21" class="badge-label">📊 Market Signals</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect width="180" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="14" y="21" class="badge-label">🚀 Pre-Viral Detection</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(372, 0)">
        <rect width="186" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="14" y="21" class="badge-label">⚡ Quant &amp; AI Agents</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(570, 0)">
        <rect width="186" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="14" y="21" class="badge-label">🌐 Competitive Intel</text>
      </g>
    </g>
  </g>
</svg>
